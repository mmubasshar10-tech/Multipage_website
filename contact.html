<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Agency | Contact</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigation bar -->
    <nav class="navbar">
        <a href="index.html" class="logo">Digital<span>Wave</span></a>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="services.html">Services</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
    </nav>

    <!-- Contact section -->
    <section class="page-section">
        <div class="page-content">

            <p class="tagline">CONTACT US</p>

            <h1>Let's Work Together</h1>

            <p>
                Have a project in mind? Send us a message and
                we will get back to you.
            </p>

            <form class="contact-form">

                <input
                    type="text"
                    placeholder="Your Name"
                    required
                >

                <input
                    type="email"
                    placeholder="Your Email"
                    required
                >

                <textarea
                    rows="6"
                    placeholder="Your Message"
                    required
                ></textarea>

                <button type="submit">Send Message</button>

            </form>

        </div>
    </section>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 DigitalWave. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
